name: Build Android widget
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project files
        run: |
          mkdir -p androidapp/.
          cat > androidapp/settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MaleClockWidget"
          include ':app'
          EOF_FILE
          mkdir -p androidapp/.
          cat > androidapp/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_FILE
          mkdir -p androidapp/.
          cat > androidapp/gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p androidapp/app
          cat > androidapp/app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.local.maleclock'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.local.maleclock'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF_FILE
          mkdir -p androidapp/app/src/main
          cat > androidapp/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Male Clock Widget">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".ClockWidget" android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p androidapp/app/src/main/res/xml
          cat > androidapp/app/src/main/res/xml/widget_info.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="250dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="120dp"
              android:targetCellWidth="4"
              android:targetCellHeight="4"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF_FILE
          mkdir -p androidapp/app/src/main/res/drawable
          cat > androidapp/app/src/main/res/drawable/bg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F2141635" />
              <corners android:radius="18dp" />
          </shape>
          EOF_FILE
          mkdir -p androidapp/app/src/main/res/drawable
          cat > androidapp/app/src/main/res/drawable/bg_card.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFB9B2FF" />
              <corners android:radius="14dp" />
          </shape>
          EOF_FILE
          mkdir -p androidapp/app/src/main/res/layout
          cat > androidapp/app/src/main/res/layout/widget.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="12dp"
              android:background="@drawable/bg">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:gravity="center_vertical"
                  android:padding="10dp" android:background="@drawable/bg_card">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/w_label" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="#3A3570" android:textSize="10sp" />
                      <TextView android:id="@+id/w_title" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:textColor="#14153A" android:textSize="18sp" android:textStyle="bold" android:maxLines="2" />
                      <TextView android:id="@+id/w_range" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="#3A3570" android:textSize="12sp" />
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:orientation="vertical" android:gravity="end">
                      <Chronometer android:id="@+id/w_cd" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="#14153A" android:textSize="24sp" android:textStyle="bold" />
                      <TextView android:id="@+id/w_cdl" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textColor="#3A3570" android:textSize="10sp" />
                  </LinearLayout>
              </LinearLayout>
              <TextView android:id="@+id/w_pray" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#C9C5FF" android:textSize="13sp" android:layout_marginTop="8dp" />
              <TextView android:id="@+id/w_th" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#9A97C9" android:textSize="10sp" android:layout_marginTop="8dp" />
              <TextView android:id="@+id/w_tasks" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#FFFFFF" android:textSize="13sp" />
              <TextView android:id="@+id/w_sh" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#9A97C9" android:textSize="10sp" android:layout_marginTop="8dp" />
              <TextView android:id="@+id/w_sched" android:layout_width="match_parent" android:layout_height="0dp"
                  android:layout_weight="1" android:textColor="#FFFFFF" android:textSize="12sp" />
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                  <TextView android:id="@+id/w_upd" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:textColor="#9A97C9" android:textSize="11sp" />
                  <TextView android:id="@+id/w_ref" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:text="Refresh" android:textColor="#C9C5FF" android:textSize="12sp" android:padding="4dp" />
              </LinearLayout>
          </LinearLayout>
          EOF_FILE
          mkdir -p androidapp/app/src/main/java/com/local/maleclock
          cat > androidapp/app/src/main/java/com/local/maleclock/MainActivity.kt <<'EOF_FILE'
          package com.local.maleclock

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(48, 96, 48, 48)
                  val head = TextView(this)
                  head.text = "Male Clock widget\n\nUse the same Firebase address and sync code as in the clock app Settings. Then long-press your home screen, open Widgets and add Male Clock."
                  head.textSize = 16f
                  col.addView(head)
                  fun field(label: String, key: String, def: String): EditText {
                      val e = EditText(this)
                      e.hint = label
                      e.setText(prefs.getString(key, def))
                      e.setSingleLine()
                      col.addView(e)
                      return e
                  }
                  val fb = field("Firebase database URL", "fb", "")
                  val code = field("Sync code", "code", "")
                  val site = field("Website address", "site", "https://rashxiel-dev.github.io/clock-male/")
                  val btn = Button(this)
                  btn.text = "Save and update widget"
                  btn.setOnClickListener {
                      prefs.edit()
                          .putString("fb", fb.text.toString().trim().trimEnd('/'))
                          .putString("code", code.text.toString().trim().lowercase())
                          .putString("site", site.text.toString().trim())
                          .apply()
                      val mgr = AppWidgetManager.getInstance(this)
                      val ids = mgr.getAppWidgetIds(ComponentName(this, ClockWidget::class.java))
                      val i = Intent(this, ClockWidget::class.java)
                      i.action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                      i.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                      sendBroadcast(i)
                      head.text = "Saved. Add the widget from your home screen if you have not yet."
                  }
                  col.addView(btn)
                  setContentView(col)
              }
          }
          EOF_FILE
          mkdir -p androidapp/app/src/main/java/com/local/maleclock
          cat > androidapp/app/src/main/java/com/local/maleclock/ClockWidget.kt <<'EOF_FILE'
          package com.local.maleclock

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.SystemClock
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.StrikethroughSpan
          import android.text.style.StyleSpan
          import android.view.View
          import android.widget.RemoteViews
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar
          import java.util.Locale
          import java.util.TimeZone

          class W(
              val label: String, val title: String, val range: String,
              val leftMs: Long, val leftLabel: String, val prayer: String,
              val tasksHead: String, val tasks: CharSequence,
              val schedHead: String, val sched: CharSequence,
              val updated: String, val changeInMs: Long
          )

          class ClockWidget : AppWidgetProvider() {

              private val DIM = Color.parseColor("#7C78B8")
              private val LIGHT = Color.parseColor("#E9E7FF")

              override fun onUpdate(context: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val pending = goAsync()
                  Thread {
                      val w = try {
                          build(context)
                      } catch (e: Exception) {
                          W("", "Could not load", e.message ?: "Check the address and code", -1L, "", "", "", "", "", "", "", -1L)
                      }
                      for (id in ids) mgr.updateAppWidget(id, makeViews(context, w, ids))
                      if (w.changeInMs > 0) {
                          val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                          am.set(AlarmManager.RTC, System.currentTimeMillis() + w.changeInMs, refreshIntent(context, ids))
                      }
                      pending.finish()
                  }.start()
              }

              private fun refreshIntent(ctx: Context, ids: IntArray): PendingIntent {
                  val r = Intent(ctx, ClockWidget::class.java)
                  r.action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                  r.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                  return PendingIntent.getBroadcast(ctx, 1, r, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              private fun makeViews(ctx: Context, w: W, ids: IntArray): RemoteViews {
                  val v = RemoteViews(ctx.packageName, R.layout.widget)
                  v.setTextViewText(R.id.w_label, w.label)
                  v.setTextViewText(R.id.w_title, w.title)
                  v.setTextViewText(R.id.w_range, w.range)
                  v.setTextViewText(R.id.w_pray, w.prayer)
                  v.setTextViewText(R.id.w_th, w.tasksHead)
                  v.setTextViewText(R.id.w_tasks, w.tasks)
                  v.setTextViewText(R.id.w_sh, w.schedHead)
                  v.setTextViewText(R.id.w_sched, w.sched)
                  v.setTextViewText(R.id.w_upd, w.updated)
                  v.setTextViewText(R.id.w_cdl, w.leftLabel)
                  if (w.leftMs >= 0) {
                      v.setViewVisibility(R.id.w_cd, View.VISIBLE)
                      v.setChronometerCountDown(R.id.w_cd, true)
                      v.setChronometer(R.id.w_cd, SystemClock.elapsedRealtime() + w.leftMs, null, true)
                  } else {
                      v.setViewVisibility(R.id.w_cd, View.GONE)
                  }
                  val site = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("site", "") ?: ""
                  val target = if (site.isEmpty()) "https://github.com" else site
                  val open = PendingIntent.getActivity(ctx, 0, Intent(Intent.ACTION_VIEW, Uri.parse(target)), PendingIntent.FLAG_IMMUTABLE)
                  v.setOnClickPendingIntent(R.id.root, open)
                  v.setOnClickPendingIntent(R.id.w_ref, refreshIntent(ctx, ids))
                  return v
              }

              private fun build(ctx: Context): W {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fb = p.getString("fb", "") ?: ""
                  val code = p.getString("code", "") ?: ""
                  if (fb.isEmpty() || code.isEmpty()) {
                      return W("", "Open the Male Clock Widget app", "and enter the Firebase address and code.", -1L, "", "", "", "", "", "", "", -1L)
                  }
                  val c = URL("$fb/rooms/$code.json").openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 10000
                  val text = c.inputStream.bufferedReader().use { it.readText() }
                  if (text.trim() == "null") return W("", "No data yet", "Sync the clock app first.", -1L, "", "", "", "", "", "", "", -1L)
                  val root = JSONObject(text)

                  val cal = Calendar.getInstance(TimeZone.getTimeZone("Indian/Maldives"))
                  val cur = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  val curMs = (cur * 60 + cal.get(Calendar.SECOND)) * 1000L
                  val today = String.format(Locale.US, "%04d-%02d-%02d", cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1, cal.get(Calendar.DAY_OF_MONTH))

                  // schedule blocks
                  val bs = ArrayList<IntArray>()
                  val bt = ArrayList<String>()
                  val re = Regex("""^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\s*\|\s*([^|]+?)\s*(?:\|\s*(.*))?$""")
                  val sched = root.optJSONObject("sched")?.optString("v") ?: ""
                  for (line in sched.split("\n")) {
                      val m = re.find(line.trim()) ?: continue
                      val s = m.groupValues[1].toInt() * 60 + m.groupValues[2].toInt()
                      val e = m.groupValues[3].toInt() * 60 + m.groupValues[4].toInt()
                      bs.add(intArrayOf(s, e))
                      bt.add(m.groupValues[5])
                  }
                  var nowIdx = -1
                  var nextIdx = -1
                  for (i in bs.indices) {
                      if (cur >= bs[i][0] && cur < bs[i][1]) {
                          nowIdx = i
                      } else if (bs[i][0] > cur && (nextIdx == -1 || bs[i][0] < bs[nextIdx][0])) {
                          nextIdx = i
                      }
                  }
                  val pick = if (nowIdx >= 0) nowIdx else nextIdx
                  var label = ""
                  var title = "Nothing more scheduled today"
                  var range = ""
                  var leftMs = -1L
                  var leftLabel = ""
                  if (pick >= 0) {
                      label = if (nowIdx >= 0) "NOW" else "NEXT UP"
                      title = bt[pick]
                      range = hm(bs[pick][0]) + " - " + hm(bs[pick][1])
                      leftMs = (if (nowIdx >= 0) bs[pick][1] else bs[pick][0]) * 60000L - curMs
                      leftLabel = if (nowIdx >= 0) "LEFT" else "TO GO"
                  }

                  // moments when the widget should refresh itself
                  val marks = ArrayList<Int>()
                  for (b in bs) {
                      marks.add(b[0])
                      marks.add(b[1])
                  }

                  // prayer
                  var pray = "Prayer times: open the clock app to refresh"
                  val pr = root.optJSONObject("pr")
                  if (pr != null && pr.optString("d") == today) {
                      pray = "All prayers done for today"
                      val arr = pr.optJSONArray("t")
                      if (arr != null) {
                          var found = false
                          for (i in 0 until arr.length()) {
                              val pair = arr.getJSONArray(i)
                              val tm = pair.getString(1)
                              val mm = tm.substring(0, 2).toInt() * 60 + tm.substring(3, 5).toInt()
                              marks.add(mm)
                              if (!found && mm > cur) {
                                  pray = "Next: " + pair.getString(0) + " " + tm
                                  found = true
                              }
                          }
                      }
                  }
                  var change = -1L
                  for (mk in marks) {
                      if (mk > cur) {
                          val d = mk * 60000L - curMs + 3000L
                          if (change < 0 || d < change) change = d
                      }
                  }

                  // schedule list
                  val past = bs.count { it[1] <= cur }
                  val sb = SpannableStringBuilder()
                  var first = -1
                  for (i in bs.indices) {
                      if (bs[i][1] > cur) {
                          first = i
                          break
                      }
                  }
                  if (first < 0) {
                      addLine(sb, "All done for today", DIM, false, false)
                  } else {
                      var shownN = 0
                      for (i in first until bs.size) {
                          if (shownN == 7) {
                              addLine(sb, "+" + (bs.size - i) + " more", DIM, false, false)
                              break
                          }
                          val isNow = i == nowIdx
                          addLine(sb, hm(bs[i][0]) + "  " + bt[i], if (isNow) Color.WHITE else LIGHT, isNow, false)
                          shownN++
                      }
                  }
                  trim(sb)

                  // tasks
                  val shown = ArrayList<JSONObject>()
                  for (o in items(root.opt("tasks"))) {
                      val due = o.optString("due")
                      if (o.optBoolean("daily") || o.optBoolean("star") || due.isEmpty() || due <= today) shown.add(o)
                  }
                  shown.sortWith(compareBy<JSONObject>({ it.optBoolean("done") }, { !it.optBoolean("star") }))
                  val doneN = shown.count { it.optBoolean("done") }
                  val tsb = SpannableStringBuilder()
                  if (shown.isEmpty()) addLine(tsb, "No tasks today", DIM, false, false)
                  var n = 0
                  for (o in shown) {
                      if (n == 6) {
                          addLine(tsb, "+" + (shown.size - 6) + " more", DIM, false, false)
                          break
                      }
                      val d = o.optBoolean("done")
                      val mark = if (d) "\u2713 " else if (o.optBoolean("star")) "\u2605 " else "\u2022 "
                      addLine(tsb, mark + o.optString("text"), if (d) DIM else Color.WHITE, false, d)
                      n++
                  }
                  val shopN = items(root.opt("shop")).count { !it.optBoolean("done") }
                  if (shopN > 0) addLine(tsb, "Shopping: " + shopN + " to get", LIGHT, false, false)
                  trim(tsb)

                  return W(
                      label, title, range, leftMs, leftLabel, pray,
                      "TASKS TODAY  " + doneN + "/" + shown.size, tsb,
                      "THITHY DAILY TASK  " + past + "/" + bs.size, sb,
                      "Updated " + hm(cur), change
                  )
              }

              private fun addLine(sb: SpannableStringBuilder, text: String, color: Int, bold: Boolean, strike: Boolean) {
                  val st = sb.length
                  sb.append(text)
                  val en = sb.length
                  sb.setSpan(ForegroundColorSpan(color), st, en, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  if (bold) sb.setSpan(StyleSpan(Typeface.BOLD), st, en, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  if (strike) sb.setSpan(StrikethroughSpan(), st, en, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                  sb.append("\n")
              }

              private fun trim(sb: SpannableStringBuilder) {
                  if (sb.length > 0) sb.delete(sb.length - 1, sb.length)
              }

              private fun items(x: Any?): List<JSONObject> {
                  val out = ArrayList<JSONObject>()
                  if (x is JSONArray) {
                      for (i in 0 until x.length()) {
                          val o = x.optJSONObject(i)
                          if (o != null) out.add(o)
                      }
                  } else if (x is JSONObject) {
                      for (k in x.keys()) {
                          val o = x.optJSONObject(k)
                          if (o != null) out.add(o)
                      }
                  }
                  return out
              }

              private fun hm(m: Int): String = String.format(Locale.US, "%02d:%02d", m / 60, m % 60)
          }
          EOF_FILE
      - name: Build APK
        working-directory: androidapp
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaleClockWidget-apk
          path: androidapp/app/build/outputs/apk/debug/app-debug.apk
