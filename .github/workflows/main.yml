name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project MaleClock.xcodeproj -scheme MaleClock -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MaleClock.app Payload/
          zip -r MaleClock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MaleClock-ipa
          path: MaleClock.ipa
